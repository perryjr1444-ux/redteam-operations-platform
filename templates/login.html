<!doctype html>
<html lang="en" data-bs-theme="dark">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login - Red Team Command Center</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Roboto:wght@400;500&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/notyf@3/notyf.min.css">
    <style>
      body {
        background: linear-gradient(135deg, #1a1a2e 0%, #0f0f1e 100%);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .login-card {
        max-width: 450px;
        width: 100%;
        backdrop-filter: blur(10px);
        background: rgba(30, 30, 46, 0.9);
        border: 1px solid rgba(233, 30, 99, 0.3);
        box-shadow: 0 8px 32px 0 rgba(233, 30, 99, 0.2);
      }
      .brand-title {
        font-family: 'Orbitron', sans-serif;
        font-weight: 700;
        color: #e91e63;
        font-size: 2.5rem;
        text-align: center;
        margin-bottom: 0.5rem;
      }
      .brand-subtitle {
        text-align: center;
        color: #888;
        margin-bottom: 2rem;
        font-size: 0.9rem;
      }
      .form-control:focus {
        border-color: #e91e63;
        box-shadow: 0 0 0 0.25rem rgba(233, 30, 99, 0.25);
      }
      .btn-primary {
        background-color: #e91e63;
        border-color: #e91e63;
      }
      .btn-primary:hover {
        background-color: #c2185b;
        border-color: #c2185b;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-md-6">
          <div class="card login-card">
            <div class="card-body p-5">
              <div class="brand-title">
                RED<span style="color: #fff;">TEAM</span> C2
              </div>
              <div class="brand-subtitle">
                <i class="bi bi-shield-lock"></i> Secure Authentication Portal
              </div>

              <form id="loginForm">
                <div class="mb-3">
                  <label for="username" class="form-label">Username</label>
                  <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-person"></i></span>
                    <input type="text" class="form-control" id="username" name="username" required autofocus>
                  </div>
                </div>

                <div class="mb-4">
                  <label for="password" class="form-label">Password</label>
                  <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-lock"></i></span>
                    <input type="password" class="form-control" id="password" name="password" required>
                  </div>
                </div>

                <button type="submit" class="btn btn-primary w-100 mb-3">
                  <i class="bi bi-box-arrow-in-right"></i> Login
                </button>

                <div class="text-center">
                  <small class="text-muted">
                    Don't have an account? <a href="/register" class="text-decoration-none">Register here</a>
                  </small>
                </div>
              </form>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/notyf@3/notyf.min.js"></script>
    <script>
      const notyf = new Notyf({
        duration: 4000,
        position: { x: 'right', y: 'top' }
      });

      document.getElementById('loginForm').addEventListener('submit', async (e) => {
        e.preventDefault();

        const username = document.getElementById('username').value;
        const password = document.getElementById('password').value;

        try {
          const response = await fetch('/api/auth/login', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
            },
            body: JSON.stringify({ username, password })
          });

          const data = await response.json();

          if (response.ok) {
            // Store token
            localStorage.setItem('access_token', data.access_token);
            localStorage.setItem('username', data.username);

            notyf.success('Login successful! Redirecting...');

            // Redirect to dashboard
            setTimeout(() => {
              window.location.href = '/';
            }, 1000);
          } else {
            notyf.error(data.detail || 'Login failed');
          }
        } catch (error) {
          notyf.error('An error occurred during login');
          console.error('Login error:', error);
        }
      });
    </script>
  </body>
</html>
