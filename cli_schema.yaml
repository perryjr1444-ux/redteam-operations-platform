# ============================================================ 
# INTEGRATION ENDPOINTS
# ============================================================ 

integration_endpoints:

  # SIEM integration
  siem:
    protocol: "syslog"
    format: "CEF (Common Event Format)"
    port: 514
    events:
      - "agent.started"
      - "agent.stopped"
      - "exercise.state_change"
      - "telemetry.synthetic (from agents)"
      - "roe.violation"
      - "kill_switch.activated"

  # Ticketing system integration
  ticketing:
    vendor: "Jira"
    api_base: "https://jira.example.com/rest/api/2"
    authentication: "bearer_token"
    endpoints:
      - path: "/issue"
        method: "POST"
        purpose: "Create purple team action items"
        payload_schema:
          project: "REDTEAM"
          issuetype: "Task"
          summary: "string"
          description: "string (markdown)"
          priority: "Critical | High | Medium | Low"
          labels: ["purple_team", "detection_gap", "exercise_id"]

  # Threat intel platform
  threat_intel:
    vendor: "MISP"
    api_base: "https://misp.example.com"
    protocol: "TAXII 2.1"
    endpoints:
      - path: "/events"
        method: "POST"
        purpose: "Export synthetic IOCs for training"
      - path: "/galaxies"
        method: "GET"
        purpose: "Import APT group TTP profiles"

  # Orchestration (infrastructure provisioning)
  orchestration:
    vendor: "Terraform"
    purpose: "Lab environment provisioning and teardown"
    hooks:
      - event: "exercise.approved"
        action: "terraform apply -var-file=lab_config.tfvars"
      - event: "exercise.completed"
        action: "terraform destroy -auto-approve"

# ============================================================ 
# END OF CLI SCHEMA
# ============================================================ 
